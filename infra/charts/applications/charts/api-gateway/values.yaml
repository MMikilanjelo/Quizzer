enabled: true

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/example/api-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: [ ]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  NODE_ENV: "development"

appSecret:
  existingSecretName: ""
  data: { }

ingress:
  enabled: false
  className: "traefik"
  annotations: { }
  host: ""
  path: "/api"
  pathType: Prefix
  tls: true
  tlsSecretName: "cert"