name: Main Deployment Orchestrator

on:
  push:
    branches: [ "master", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      userservice: ${{ steps.filter.outputs.userservice }}
      apigateway: ${{ steps.filter.outputs.apigateway }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            userservice:
              - 'server/UserService/src/**'
              - 'server/UserService/Directory.Packages.props'
            apigateway:
              - 'server/ApiGateway/**'

  deploy-userservice:
    name: Deploy User Service
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.userservice == 'true' }}
    uses: ./.github/workflows/deploy-userservice.yml 
    with:
      target_env: ${{ github.ref_name == 'master' && 'production' || 'dev' }}
    secrets: inherit 

  deploy-gateway:
    name: Deploy API Gateway
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.apigateway == 'true' }}
    uses: ./.github/workflows/deploy-gateway.yml
    with:
      target_env: ${{ github.ref_name == 'master' && 'production' || 'dev' }}
    secrets: inherit