name: Deploy UserService

on:
  workflow_call:
    inputs:
      target_env:
        description: 'The GitHub Environment to deploy to'
        type: string
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    environment: ${{ inputs.target_env }}
    runs-on: ubuntu-24.04-arm 
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: server/UserService
          file: server/UserService/src/Web.Api/Dockerfile
          push: true
          platforms: linux/arm64 
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.target_env }}

      - name: Dokploy Deployment
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_USERSERVICE_APP_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application